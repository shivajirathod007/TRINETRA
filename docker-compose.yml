services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trinetra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: trinetra_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - trinetra_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trinetra -d trinetra" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trinetra_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    networks:
      - trinetra_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: trinetra_api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://trinetra:trinetra_pass@postgres:5432/trinetra
      - DATABASE_URL_SYNC=postgresql://trinetra:trinetra_pass@postgres:5432/trinetra
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=jarsh-phi3
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    networks:
      - trinetra_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=8 -Q scans,discovery,analysis
    environment:
      - PYTHONPATH=/app/backend
      - DATABASE_URL=postgresql+asyncpg://trinetra:trinetra_pass@postgres:5432/trinetra
      - DATABASE_URL_SYNC=postgresql://trinetra:trinetra_pass@postgres:5432/trinetra
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=jarsh-phi3
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    networks:
      - trinetra_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  # ─── Celery Flower Monitor ───────────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: trinetra_flower
    restart: unless-stopped
    command: celery -A workers.celery_app --broker=redis://redis:6379/0 flower --port=5555
    environment:
      - PYTHONPATH=/app/backend
      - DATABASE_URL=postgresql+asyncpg://trinetra:trinetra_pass@postgres:5432/trinetra
      - DATABASE_URL_SYNC=postgresql://trinetra:trinetra_pass@postgres:5432/trinetra
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "5555:5555"
    networks:
      - trinetra_net
    depends_on:
      - redis
      - worker

  # ─── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: trinetra_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      # Vite proxy target: from inside container, API is reachable as "api:8000"
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - trinetra_net
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local

networks:
  trinetra_net:
    driver: bridge
